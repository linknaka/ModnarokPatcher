[package]
name = "modnarok-patcher"
version = "0.1.0"
edition = "2021"
description = "MODNAROK client updater and troubleshooting launcher"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = true }
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
futures-util = "0.3"
